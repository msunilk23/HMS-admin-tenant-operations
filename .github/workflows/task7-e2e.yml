name: Phase 1 stabilization gate

on:
  workflow_dispatch:
  pull_request:
    branches: [phase1-stabilization]
  push:
    branches: [phase1-stabilization, phase1-final-release-fixes]

jobs:
  stabilization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hospital_user
          POSTGRES_PASSWORD: release_a_ci_only_password
          POSTGRES_DB: hospital
        ports: ['5433:5432']
        options: >-
          --health-cmd="pg_isready -U hospital_user -d hospital"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+asyncpg://hospital_user:release_a_ci_only_password@localhost:5433/hospital
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      REDIS_URL: redis://localhost:6379
      E2E_DATABASE_URL: postgresql+asyncpg://hospital_user:release_a_ci_only_password@localhost:5433/hospital
      E2E_EXPECTED_DATABASE: hospital
      E2E_BASE_URL: http://localhost:5173
      E2E_MANAGED_BACKEND: 'false'
      E2E_BACKEND_HEALTH_URL: http://localhost:8000/health
      E2E_BACKEND_OPENAPI_URL: http://localhost:8000/api/openapi.json
      E2E_ENVIRONMENT: E2E
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.CI_SECRET_KEY }}
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Upgrade database to reversible boundary
        working-directory: backend
        run: alembic upgrade 0088
      - name: Verify sole migration graph head
        working-directory: backend
        run: test "$(alembic heads | grep -c '(head)')" -eq 1
      - name: Verify reversible migration boundary and forward-only 0089 policy
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          # 0088 is the last automatically reversible Pharmacy (P25-P34) migration.
          # 0089 (Super Admin/tenant decoupling) is an intentionally forward-only
          # policy migration: its downgrade() deliberately raises once any user
          # row has tenant_id/tenant_name = NULL, which is guaranteed immediately
          # after upgrade (it nulls those columns for role='super_admin'). Do not
          # attempt an automated downgrade from 0089 to 0088 — it is designed to
          # fail. See docs/RELEASE_A_FINAL_READINESS_AND_OPD_UAT.md for the
          # controlled manual rollback runbook.
          alembic upgrade 0088
          alembic downgrade 0087
          alembic upgrade 0088
          alembic upgrade 0089
          test "$(alembic heads | grep -c '(head)')" -eq 1
          # Forward-only contract: 0089 must leave every Super Admin user
          # tenant-independent (tenant_id and tenant_name both NULL).
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main() -> None:
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.begin() as conn:
                  orphaned_non_super_admin = (await conn.execute(text(
                      "SELECT count(*) FROM public.users "
                      "WHERE role != 'super_admin' AND (tenant_id IS NULL OR tenant_name IS NULL)"
                  ))).scalar_one()
                  assert orphaned_non_super_admin == 0, "non-super_admin users must remain tenant-bound"
                  misbound_super_admins = (await conn.execute(text(
                      "SELECT count(*) FROM public.users "
                      "WHERE role = 'super_admin' AND (tenant_id IS NOT NULL OR tenant_name IS NOT NULL)"
                  ))).scalar_one()
                  assert misbound_super_admins == 0, "0089 must leave every Super Admin tenant-independent"
              await engine.dispose()

          asyncio.run(main())
          PY
          alembic upgrade head
      - name: Verify all configured schemas are at the sole head
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          import os
          import re

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main() -> None:
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  head = (await conn.execute(text("SELECT version_num FROM public.alembic_version"))).scalar_one()
                  schemas = (await conn.execute(text(
                      "SELECT schema_name FROM public.tenants WHERE is_active = true ORDER BY schema_name"
                  ))).scalars().all()
                  for schema in schemas:
                      assert re.fullmatch(r"[a-z][a-z0-9_]{1,62}", schema), f"invalid tenant schema: {schema}"
                      version = (await conn.execute(text(
                          f'SELECT version_num FROM "{schema}".alembic_version'
                      ))).scalar_one()
                      assert version == head, f"{schema} is at {version}, expected {head}"
              await engine.dispose()

          asyncio.run(main())
          PY
      - name: Run backend regression suite
        working-directory: backend
        run: pytest tests/ -q
      - name: Run critical PostgreSQL tests with zero skips
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest tests/test_document_integrity_phase1_taskEF.py tests/test_migrations_phase1_taskG.py -q | tee critical-pytest.txt
          ! grep -Eq '[0-9]+ skipped' critical-pytest.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend type-check
        working-directory: frontend
        run: npm run type-check
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Validate Compose, build images and wait for application health
        env:
          POSTGRES_USER: hospital_user
          POSTGRES_DB: hospital
          PGADMIN_DEFAULT_EMAIL: ci-admin@example.invalid
          POSTGRES_HOST_PORT: '55433'
          REDIS_HOST_PORT: '56379'
          BACKEND_HOST_PORT: '58000'
          FRONTEND_HOST_PORT: '55173'
        run: |
          set -euo pipefail
          umask 077
          compose_db_password="$(openssl rand -hex 32)"
          compose_secret_key="$(openssl rand -hex 32)"
          compose_pgadmin_password="$(openssl rand -hex 32)"
          compose_webhook_secret="$(openssl rand -hex 32)"
          printf '%s\n' \
            "ENVIRONMENT=test" \
            "DEBUG=false" \
            "SECRET_KEY=$compose_secret_key" \
            "POSTGRES_USER=$POSTGRES_USER" \
            "POSTGRES_DB=$POSTGRES_DB" \
            "POSTGRES_DB_URL_PASSWORD=$compose_db_password" \
            "PGADMIN_DEFAULT_EMAIL=$PGADMIN_DEFAULT_EMAIL" \
            "PGADMIN_DEFAULT_PASSWORD=$compose_pgadmin_password" \
            "REDIS_URL=redis://redis:6379" \
            "RAZORPAY_WEBHOOK_SECRET=$compose_webhook_secret" > .env
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml build backend frontend
          docker compose -f infra/docker-compose.yml up -d --wait postgres redis backend frontend
          curl --fail --silent --show-error http://localhost:58000/health
          curl --fail --silent --show-error http://localhost:55173/ > /dev/null
      - name: Stop Compose health stack
        if: always()
        run: |
          if test -f .env; then
            cleanup_status=0
            docker compose -f infra/docker-compose.yml down --volumes --remove-orphans || cleanup_status=$?
            rm -f .env
            exit "$cleanup_status"
          fi
      - name: Validate PostgreSQL backup and restore
        env:
          PGPASSWORD: release_a_ci_only_password
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump -h localhost -p 5433 -U hospital_user -d hospital -Fc -f release-a.dump
          createdb -h localhost -p 5433 -U hospital_user release_a_restore
          pg_restore -h localhost -p 5433 -U hospital_user -d release_a_restore --exit-on-error release-a.dump
          test "$(psql -h localhost -p 5433 -U hospital_user -d release_a_restore -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'alembic_version'")" = "1"
          source_head="$(psql -h localhost -p 5433 -U hospital_user -d hospital -Atc "SELECT version_num FROM public.alembic_version")"
          restored_head="$(psql -h localhost -p 5433 -U hospital_user -d release_a_restore -Atc "SELECT version_num FROM public.alembic_version")"
          test "$restored_head" = "$source_head"
          dropdb -h localhost -p 5433 -U hospital_user release_a_restore
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: backend
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend-e2e.log 2>&1 &
      - name: Start frontend
        working-directory: frontend
        run: npm run dev -- --host 0.0.0.0 > ../frontend-e2e.log 2>&1 &
      - name: Wait for services
        run: |
          python - <<'PY'
          import time, urllib.request
          for url in ('http://localhost:8000/health', 'http://localhost:5173/login'):
              for _ in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f'Service did not start: {url}')
          PY
      - name: Clean deterministic browser fixture schemas
        working-directory: backend
        env:
          E2E_ALLOW_DESTRUCTIVE_RESET: 'true'
        run: python tests/e2e_seed_task7.py cleanup
      - name: Run Phase 1 browser suite
        working-directory: frontend
        env:
          E2E_ALLOW_DESTRUCTIVE_RESET: 'true'
        run: npm run e2e -- --reporter=line
      - name: Verify runtime health and tenant authentication
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://localhost:8000/health", timeout=5) as response:
              assert response.status == 200
          request = urllib.request.Request(
              "http://localhost:8000/api/v1/auth/login",
              data=json.dumps({"login_id": "e2e_doctor_task7", "password": "E2eDoctor@123"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              token = json.load(response)["access_token"]
          protected = urllib.request.Request(
              "http://localhost:8000/api/v1/visits",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(protected, timeout=5) as response:
              assert response.status == 200
          PY
      - name: Scan committed history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-playwright-failure-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
