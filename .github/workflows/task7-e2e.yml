name: Phase 1 stabilization gate

on:
  workflow_dispatch:
  pull_request:
    branches: [phase1-stabilization]
  push:
    branches: [phase1-stabilization, phase1-final-release-fixes]

jobs:
  stabilization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hospital_user
          POSTGRES_PASSWORD: hospital_pass
          POSTGRES_DB: hospital
        ports: ['5433:5432']
        options: >-
          --health-cmd="pg_isready -U hospital_user -d hospital"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+asyncpg://hospital_user:hospital_pass@localhost:5433/hospital
      SECRET_KEY: task7-ci-secret
      REDIS_URL: redis://localhost:6379
      E2E_DATABASE_URL: postgresql+asyncpg://hospital_user:hospital_pass@localhost:5433/hospital
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Upgrade database
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migration downgrade and re-upgrade
        working-directory: backend
        run: |
          alembic downgrade -2
          alembic upgrade head
          test "$(alembic heads | grep -c '(head)')" -eq 1
      - name: Run backend regression suite
        working-directory: backend
        run: pytest tests/ -q
      - name: Run critical PostgreSQL tests with zero skips
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest tests/test_document_integrity_phase1_taskEF.py tests/test_migrations_phase1_taskG.py -q | tee critical-pytest.txt
          ! grep -Eq '[0-9]+ skipped' critical-pytest.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend type-check
        working-directory: frontend
        run: npm run type-check
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: backend
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend-e2e.log 2>&1 &
      - name: Start frontend
        working-directory: frontend
        run: npm run dev -- --host 0.0.0.0 > ../frontend-e2e.log 2>&1 &
      - name: Wait for services
        run: |
          python - <<'PY'
          import time, urllib.request
          for url in ('http://localhost:8000/health', 'http://localhost:5173/login'):
              for _ in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f'Service did not start: {url}')
          PY
      - name: Run Phase 1 browser suite
        working-directory: frontend
        run: npm run e2e -- --reporter=line
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-playwright-failure-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
